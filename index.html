<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Magic</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>✨ AI Photo Magic</h1>
    <p>AI se apni photo edit karein</p>

    <label for="image">📸 Photo Upload</label>
    <input type="file" id="image" accept="image/*">

    <label for="prompt">✍️ Apna Prompt</label>
    <textarea id="prompt" placeholder="Example: Background change to beautiful mountains"></textarea>

    <div class="buttons">

      <button onclick="generatePhoto()">
        ✨ Generate AI Photo
      </button>

      <button onclick="clothesChange()">
        👗 Clothes Change
      </button>

      <button onclick="backgroundChange()">
        🌄 Background Change
      </button>

      <button onclick="aiEnhance()">
        ✨ AI Enhance
      </button>

    </div>

    <p id="status"></p>

    <img id="resultImage" style="display:none; max-width:100%; margin-top:20px; border-radius:15px;">

  </div>

  <script src="App.js"></script>

</body>
</html>
